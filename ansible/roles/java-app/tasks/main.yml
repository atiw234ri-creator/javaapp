---
- name: Create application directory
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: '0755'


- name: Copy jar
  copy:
    src: "{{ workspace }}/app/target/{{ jar_file }}"
    dest: "{{ app_dir }}/{{ jar_file }}"
    owner: ec2-user
    group: ec2-user
    mode: '0755'